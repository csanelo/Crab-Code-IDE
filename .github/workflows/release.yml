name: Release version

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
      - name: Set up Node.js 26.5.0
        uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify tag matches package version
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${PACKAGE_VERSION}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match package version v${PACKAGE_VERSION}"
            exit 1
          }
      - name: Install exact dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Compile application
        run: npm run build

  package:
    name: Package ${{ matrix.name }}
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            command: npm run package:win
            artifact: CrabCode-Windows-x64
            files: |
              dist/*.exe
              dist/*.blockmap
              dist/latest*.yml
          - name: Linux x64
            os: ubuntu-latest
            command: npm run package:linux
            artifact: CrabCode-Linux-x64
            files: |
              dist/*.AppImage
              dist/*.deb
              dist/*.blockmap
              dist/latest*.yml
          - name: macOS ARM64
            os: macos-14
            command: npm run package:mac -- --arm64
            artifact: CrabCode-macOS-ARM64
            files: |
              dist/*.dmg
              dist/*-mac.zip
              dist/*.blockmap
              dist/latest*.yml
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
      - name: Set up Node.js 26.5.0
        uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-${{ runner.arch }}-electron-${{ hashFiles('package-lock.json') }}
      - name: Install exact dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Build native package
        run: ${{ matrix.command }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish ${{ github.ref_name }}
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
          generate_release_notes: true
          fail_on_unmatched_files: true
